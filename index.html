<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Theo의 구구단 레이싱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 시작 화면 -->
  <section id="startScreen" class="screen">
    <h1>🏎️ Theo의 구구단 레이싱</h1>

    <h2>1. 캐릭터를 골라주세요</h2>
    <div id="charList"></div>

    <h2>2. 난이도를 골라주세요</h2>
    <div id="diffList"></div>

    <button id="startBtn" class="bigBtn">🏁 레이스 시작!</button>

    <p class="howto">
      PC: ← → 또는 A / D 키로 이동 · 스페이스바로 아이템 사용<br>
      모바일: 화면 아래 큰 버튼으로 이동하고 아이템을 사용해요<br>
      트랙 위 <b>일반 상자</b>는 아이템, <b>× 상자</b>는 곱셈 문제예요!
    </p>
  </section>

  <!-- 레이싱 화면 -->
  <section id="raceScreen" class="screen hidden">
    <div id="hud">
      <div class="hudBox" id="hudRank">순위 -/6</div>
      <div class="hudBox" id="hudLap">바퀴 -/3</div>
      <div class="hudBox" id="hudGaugeBox">
        곱셈 파워 <span id="gaugeText">0/5</span>
        <div id="gaugeBarWrap"><div id="gaugeBar"></div></div>
      </div>
      <div class="hudBox" id="hudItem">🎁 <span id="itemText">없음</span></div>
      <button id="muteBtn" class="hudBox">🔊</button>
    </div>

    <div id="canvasWrap">
      <canvas id="gameCanvas" width="640" height="900"></canvas>
      <div id="boostBanner" class="hidden">구구단 파워 UP! ✨</div>
      <div id="finishBanner" class="hidden"></div>

      <div id="mathPopup" class="hidden">
        <div id="mathTimerBar"><div id="mathTimerFill"></div></div>
        <div id="mathQuestion">? × ? = ?</div>
        <div id="mathAnswers">
          <button class="answerBtn" data-idx="0"></button>
          <button class="answerBtn" data-idx="1"></button>
          <button class="answerBtn" data-idx="2"></button>
        </div>
        <div id="mathResult" class="hidden"></div>
      </div>
    </div>

    <div id="mobileControls">
      <button id="btnLeft" class="ctrlBtn">◀</button>
      <button id="btnItem" class="ctrlBtn itemCtrlBtn">🎁</button>
      <button id="btnRight" class="ctrlBtn">▶</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="resultScreen" class="screen hidden">
    <h1 id="resultTitle">🏁 경기 결과</h1>
    <p id="resultRank" class="resultLine"></p>
    <p id="resultScore" class="resultLine"></p>
    <div id="wrongWrap">
      <h2 id="wrongTitle" class="hidden">틀린 문제를 확인해봐요</h2>
      <div id="wrongList"></div>
    </div>
    <button id="retryBtn" class="bigBtn">🔁 같은 캐릭터로 다시 하기</button>
    <button id="homeBtn" class="bigBtn secondaryBtn">🏠 처음으로</button>
  </section>

</div>
<script src="game.js"></script>
</body>
</html>
